<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Адвокат Ольга Дученко</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1d2b40">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#fbfaf7 0%,#f2efe9 100%);
    color:#16202e;min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  .box{max-width:520px}
  .code{font-family:Georgia,serif;font-size:120px;font-weight:700;color:#1d2b40;line-height:1}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#b08948;margin-bottom:10px}
  h1{font-family:Georgia,serif;font-size:32px;color:#1d2b40;margin:14px 0 12px}
  p{color:#5f6b7a;font-size:17px;margin-bottom:30px}
  a{
    display:inline-flex;align-items:center;gap:9px;background:#1d2b40;color:#fff;
    font-weight:600;font-size:15.5px;padding:15px 30px;border-radius:2px;text-decoration:none;transition:.2s;
  }
  a:hover{background:#243650}
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">Ошибка 404</div>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Кажется, такой страницы не существует или она была перемещена. Вернитесь на главную.</p>
    <a href="/">← На главную</a>
  </div>
</body>
</html>
